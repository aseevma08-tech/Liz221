<style>
/* Одна карточка на экране. На телефоне занимает весь экран, на компьютере стоит в рамке телефона. */
:root{
  color-scheme:light;
  --p-bg:#fbeef4;--p-frame:#f4cddd;--p-card:#ffffff;--p-accent:#d8457c;--p-on:#ffffff;
  --p-text:#261c2b;--p-muted:#7d6f85;--p-soft:#fbe0ea;--p-line:#f0d3df;
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--p-bg);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;background:var(--p-bg);color:var(--p-text);
  font-family:var(--font-body);font-size:16px;line-height:1.45;
  display:flex;align-items:center;justify-content:center;padding:24px 16px;transition:background .3s
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--p-accent);outline-offset:2px}

.phone{
  position:relative;width:100%;max-width:380px;min-height:640px;background:var(--p-bg);
  border:10px solid var(--p-frame);border-radius:46px;padding:52px 12px 18px;overflow:hidden;
  display:flex;flex-direction:column;gap:10px;transition:background .3s,border-color .3s
}
.island{position:absolute;top:12px;left:50%;width:96px;height:24px;transform:translateX(-50%);border-radius:999px;background:var(--p-frame)}
@media (max-width:520px){
  body{display:block;padding:0}
  .phone{
    max-width:none;min-height:100vh;min-height:100dvh;border:0;border-radius:0;
    padding:calc(env(safe-area-inset-top,0px) + 22px) 14px calc(env(safe-area-inset-bottom,0px) + 22px)
  }
  .island{display:none}
}

.pbar{position:relative;height:30px;margin-inline:10px;flex:none}
.pbar .trk{position:absolute;left:0;right:0;top:12px;height:8px;border-radius:999px;border:1px solid var(--p-soft);
  background:repeating-linear-gradient(-45deg,var(--p-soft) 0 6px,transparent 6px 12px)}
.pbar .trk i{position:absolute;left:0;top:-1px;bottom:-1px;width:calc(var(--p,0) * 100%);background:var(--p-accent);border-radius:999px;transition:width .5s ease}
.pbar .pin{position:absolute;top:0;width:28px;height:28px;left:calc(var(--p,0) * (100% - 28px));color:var(--p-accent);transition:left .5s ease}

.card-wrap{flex:1;display:flex;filter:drop-shadow(0 12px 16px rgba(60,20,40,.10))}
.card{
  flex:1;background:var(--p-card);border-radius:30px;padding:34px 24px;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px
}
.card h2{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.18;margin:0;text-wrap:balance;letter-spacing:-.01em}
.card .sub{margin:0;color:var(--p-muted);font-size:15px}
.card .desc{margin:0;color:var(--p-muted);font-size:16px;text-wrap:balance}
.stk{width:104px;height:104px;color:var(--p-accent)}
.stk svg{width:100%;height:100%;display:block}
.bigemo{font-size:72px;line-height:1}

.pbtn{border:0;border-radius:999px;font-weight:700;font-size:17px;padding:14px 24px;width:100%}
.pbtn.main{background:var(--p-accent);color:var(--p-on)}
.pbtn.ghost{background:var(--p-soft);color:var(--p-text)}
.choices{position:relative;width:100%;height:128px}
.choices .main{position:absolute;left:0;right:0;top:0}
.choices .ghost{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:auto;white-space:nowrap;transition:left .25s ease,top .25s ease}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{
  border:2px solid var(--p-line);background:transparent;color:var(--p-text);border-radius:20px;padding:12px 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere
}
.opt .em{font-size:34px;line-height:1.1}
.opt[aria-pressed="true"]{border-color:var(--p-accent);background:var(--p-soft)}

.pfield{width:100%;text-align:left;display:flex;flex-direction:column;gap:4px}
.pfield label{font-size:13px;font-weight:700;color:var(--p-muted)}
.pfield input{
  -webkit-appearance:none;appearance:none;width:100%;min-width:0;min-height:46px;font-size:16px;
  border:2px solid var(--p-line);border-radius:999px;padding:9px 16px;background:var(--p-card);color:var(--p-text)
}
.recap{list-style:none;margin:0;padding:12px 14px;display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--p-soft);border-radius:18px;font-size:14px}
.recap span{color:var(--p-muted)}
.pnote{font-size:14px;color:var(--p-muted);margin:0;text-wrap:balance}
.rowbtns{display:flex;flex-direction:column;gap:8px;width:100%}
.pcopy{width:100%;border:2px solid var(--p-line);border-radius:14px;padding:8px;font-size:14px;background:var(--p-card);color:var(--p-text);min-height:78px}

.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx svg{position:absolute;top:-40px;color:var(--p-accent);opacity:0;animation:fall linear forwards}
@keyframes fall{
  0%{opacity:0;transform:translateY(0) rotate(0)}
  10%{opacity:.85}
  85%{opacity:.85}
  100%{opacity:0;transform:translateY(115vh) rotate(40deg)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
'use strict';

/* ============================== НАСТРОЙКИ ==============================
   Тексты, варианты, дату и цвета можно менять прямо здесь.
   ntfyTopic: тема в приложении ntfy, куда приходят ответы. Её менять не нужно,
   иначе уведомления перестанут приходить. */
var SETTINGS={
  ntfyTopic:'walk-d03d31463b9d10ecc63e',

  invite:{q:'Ты пойдёшь со мной на свидание?',yes:'Да',no:'Нет',run:true,sticker:2},
  cats:[
    {key:'dishes',on:true,name:'Блюда',title:'Что ты хочешь?',sub:'Выбери, что тебе по вкусу',multi:false,
      items:[{e:'🍕',t:'Пицца'},{e:'🍣',t:'Суши'},{e:'🍔',t:'Бургер'},{e:'🍝',t:'Паста'},{e:'🍜',t:'Рамен'},{e:'🍰',t:'Десерт'}]},
    {key:'movies',on:false,name:'Кино',title:'Какое кино?',sub:'Можно выбрать несколько',multi:true,
      items:[{e:'😂',t:'Комедия'},{e:'💞',t:'Мелодрама'},{e:'👻',t:'Ужасы'},{e:'🚀',t:'Фантастика'},{e:'🎨',t:'Мультфильм'}]},
    {key:'drinks',on:true,name:'Напитки',title:'Что будем пить?',sub:'Выбери любимое',multi:false,
      items:[{e:'☕',t:'Кофе'},{e:'🍫',t:'Какао'},{e:'🍵',t:'Чай'},{e:'🍋',t:'Лимонад'},{e:'🥤',t:'Милкшейк'}]},
    {key:'acts',on:true,name:'Активности',title:'Чем займёмся?',sub:'Выбери, что хочется',multi:true,
      items:[{e:'🚶',t:'Прогулка'},{e:'⛸️',t:'Каток'},{e:'🎳',t:'Боулинг'},{e:'🎲',t:'Настолки'},{e:'🌇',t:'Смотреть закат'}]},
    {key:'places',on:false,name:'Места',title:'Куда пойдём?',sub:'Выбери место',multi:false,
      items:[{e:'🌳',t:'Лагерный сад'},{e:'🌊',t:'Набережная Томи'},{e:'🍂',t:'Университетская роща'},{e:'🏙️',t:'Центр города'}]}
  ],
  date:{title:'И так… когда ты свободна?',date:'2026-10-10',time:'19:00',btn:'Выбрать дату'},
  /* В описании подставляются {date} (10 октября), {weekday} (суббота), {time} и {food} (её выбор блюда). */
  final:{title:'Рад, что ты согласилась',desc:'Будь готова {date} в {time}. Я зайду за тобой.',hearts:true},
  decline:{title:'Понял тебя',desc:'Спасибо, что ответила честно.'},
  design:{shape:'wavy',theme:0,progress:true}
};
/* ======================================================================= */

var cfg=SETTINGS;
var $=function(s){return document.querySelector(s)};
function nb(s){return String(s).replace(/(^|\s)(в|к|с|и|я|на|за|со|по|ты)\s/gi,'$1$2\u00a0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var reduced=false;
try{reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}

var THEMES=[
  {'--p-bg':'#fbeef4','--p-frame':'#f4cddd','--p-card':'#ffffff','--p-accent':'#d8457c','--p-on':'#ffffff','--p-text':'#261c2b','--p-muted':'#7d6f85','--p-soft':'#fbe0ea','--p-line':'#f0d3df'},
  {'--p-bg':'#edf5fb','--p-frame':'#bfdaee','--p-card':'#ffffff','--p-accent':'#3a7fc4','--p-on':'#ffffff','--p-text':'#1b2634','--p-muted':'#64768a','--p-soft':'#dcecf8','--p-line':'#cfe2f1'},
  {'--p-bg':'#eef6ec','--p-frame':'#c6dfc1','--p-card':'#fffef7','--p-accent':'#4f9552','--p-on':'#ffffff','--p-text':'#1f2a1f','--p-muted':'#6b7d6a','--p-soft':'#e0eedb','--p-line':'#d3e5cd'}
];
var STICKERS=[
  '<svg viewBox="0 0 120 120" aria-hidden="true"><path fill="currentColor" d="M60 104S16 78 10 46C6 24 22 10 40 10c9 0 16 4 20 11 4-7 11-11 20-11 18 0 34 14 30 36-6 32-50 58-50 58z"/><ellipse cx="38" cy="34" rx="9" ry="6" fill="#fff" opacity=".5" transform="rotate(-30 38 34)"/></svg>',
  '<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="34" cy="34" r="14" fill="#e8b98e" stroke="#4a3328" stroke-width="3"/><circle cx="86" cy="34" r="14" fill="#e8b98e" stroke="#4a3328" stroke-width="3"/><circle cx="60" cy="58" r="34" fill="#f1c9a5" stroke="#4a3328" stroke-width="3"/><circle cx="48" cy="54" r="4" fill="#4a3328"/><circle cx="72" cy="54" r="4" fill="#4a3328"/><ellipse cx="60" cy="68" rx="7" ry="5" fill="#4a3328"/><circle cx="42" cy="66" r="6" fill="#f08aa0" opacity=".6"/><circle cx="78" cy="66" r="6" fill="#f08aa0" opacity=".6"/><path fill="currentColor" stroke="#4a3328" stroke-width="3" stroke-linejoin="round" d="M60 112s-20-11-22-24c-1-9 5-15 12-15 5 0 8 3 10 6 2-3 5-6 10-6 7 0 13 6 12 15-2 13-22 24-22 24z"/></svg>',
  '<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 62v52" stroke="#4b8a4f" stroke-width="5" stroke-linecap="round"/><ellipse cx="42" cy="92" rx="16" ry="8" fill="#5da160" transform="rotate(-30 42 92)"/><ellipse cx="78" cy="82" rx="16" ry="8" fill="#5da160" transform="rotate(30 78 82)"/><circle cx="60" cy="40" r="30" fill="currentColor"/><circle cx="60" cy="40" r="20" fill="#fff" opacity=".18"/><path d="M60 40c6-1 9 4 6 8s-11 3-13-3 4-14 14-13 16 9 14 19" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".75"/></svg>'
];
var HEART_PATH='M12 21s-7.6-4.7-9.7-9.3C.7 8.2 2.9 4.4 6.6 4.4c2 0 3.7 1.1 4.4 2.7.7-1.6 2.4-2.7 4.4-2.7 3.7 0 5.9 3.8 4.3 7.3C19.6 16.3 12 21 12 21z';

/* Плавный волнистый край: скруглённый прямоугольник, по краю которого идёт синусоида. Считается по реальному размеру карточки. */
function wavyPoly(W,H){
  var A=8,R=Math.min(46,W/4,H/4),x0=A,y0=A,x1=W-A,y1=H-A,pts=[];
  function line(ax,ay,bx,by,nx,ny){var L=Math.hypot(bx-ax,by-ay),n=Math.max(1,Math.round(L/2));for(var i=0;i<n;i++){var t=i/n;pts.push([ax+(bx-ax)*t,ay+(by-ay)*t,nx,ny])}}
  function arc(cx,cy,a0,a1){var n=Math.max(1,Math.round(Math.abs(a1-a0)*R/2));for(var i=0;i<n;i++){var a=a0+(a1-a0)*i/n;pts.push([cx+R*Math.cos(a),cy+R*Math.sin(a),Math.cos(a),Math.sin(a)])}}
  line(x0+R,y0,x1-R,y0,0,-1);arc(x1-R,y0+R,-Math.PI/2,0);
  line(x1,y0+R,x1,y1-R,1,0);arc(x1-R,y1-R,0,Math.PI/2);
  line(x1-R,y1,x0+R,y1,0,1);arc(x0+R,y1-R,Math.PI/2,Math.PI);
  line(x0,y1-R,x0,y0+R,-1,0);arc(x0+R,y0+R,Math.PI,Math.PI*1.5);
  var total=0,cum=[0],i;
  for(i=1;i<pts.length;i++){total+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);cum.push(total)}
  total+=Math.hypot(pts[0][0]-pts[pts.length-1][0],pts[0][1]-pts[pts.length-1][1]);
  var waves=Math.max(8,Math.round(total/90)),out=[];
  for(i=0;i<pts.length;i++){
    var d=A*Math.sin(2*Math.PI*waves*cum[i]/total);
    out.push((pts[i][0]+pts[i][2]*d).toFixed(1)+'px '+(pts[i][1]+pts[i][3]*d).toFixed(1)+'px');
  }
  return 'polygon('+out.join(',')+')';
}
function applyShape(){
  var wavy=cfg.design.shape==='wavy';
  card.style.borderRadius=wavy?'0':'';
  if(!wavy){card.style.clipPath='';return}
  var w=card.clientWidth,h=card.clientHeight;
  if(w>0&&h>0)card.style.clipPath=wavyPoly(w,h);
}

var st={screen:'invite',sel:{},tries:0,date:null,time:null};
var card=$('#card'),pbar=$('#pbar'),fx=$('#fx');

function cats(){return cfg.cats.filter(function(c){return c.on&&c.items.length})}
function list(){return ['invite'].concat(cats().map(function(c){return 'c:'+c.key}),['date','final'])}
function catByScreen(s){var k=s.slice(2);return cfg.cats.filter(function(c){return c.key===k})[0]}
function emojiOf(c,label){var r='';c.items.forEach(function(o){if(o.t===label)r=o.e});return r}

function todayIso(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseDate(){
  var p=String(st.date||cfg.date.date).split('-');if(p.length<3)return null;
  var d=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(d.getTime())?null:d;
}
function dateStr(){var d=parseDate();return d?d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'}):''}
function weekdayStr(){var d=parseDate();return d?d.toLocaleDateString('ru-RU',{weekday:'long'}):''}
function dateFull(){var d=parseDate();return d?d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}):''}
function timeStr(){return st.time||cfg.date.time}
function foodStr(){var a=st.sel.dishes||[];return a.length?a.join(', '):'что захочешь'}
function fill(s){
  return String(s).replace(/\{date\}/g,dateStr()).replace(/\{weekday\}/g,weekdayStr())
    .replace(/\{time\}/g,timeStr()).replace(/\{food\}/g,foodStr());
}

/* ---------- отправка ответа в ntfy ---------- */
function notify(title,lines,tag){
  var topic=cfg.ntfyTopic;
  if(!topic)return Promise.reject(new Error('no-topic'));
  var ctl=typeof AbortController==='function'?new AbortController():null;
  var timer=ctl?setTimeout(function(){ctl.abort()},9000):0;
  var url='https://ntfy.sh/'+encodeURIComponent(topic)+'?title='+encodeURIComponent(title)+'&tags='+encodeURIComponent(tag||'love_letter');
  return fetch(url,{method:'POST',body:lines.join('\n'),signal:ctl?ctl.signal:undefined}).then(
    function(r){clearTimeout(timer);if(!r.ok)throw new Error('http '+r.status);return true},
    function(e){clearTimeout(timer);throw e}
  );
}
function answerLines(){
  var out=['Согласилась: '+dateFull()+', '+timeStr()];
  cats().forEach(function(c){
    var a=st.sel[c.key]||[];
    if(a.length)out.push(c.name+': '+a.map(function(l){return (emojiOf(c,l)+' '+l).trim()}).join(', '));
  });
  return out;
}
function cardText(){
  var emo=cats().map(function(c){return (st.sel[c.key]||[]).map(function(l){return emojiOf(c,l)}).join('')}).filter(Boolean).join(' ');
  var d=parseDate(),short=d?d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'numeric'}):'';
  return '💌 '+short+' '+timeStr()+(emo?' '+emo:'');
}
function copyText(text,host){
  function fallback(){
    var old=host.querySelector('textarea');if(old)old.remove();
    var t=document.createElement('textarea');t.readOnly=true;t.value=text;t.className='pcopy';
    host.appendChild(t);t.focus();t.select();
  }
  try{navigator.clipboard.writeText(text).then(function(){var n=$('#stat');if(n)n.textContent='Скопировано. Вставь в чат и отправь мне.'},fallback)}
  catch(e){fallback()}
}
function deliver(){
  var stat=$('#stat'),again=$('#again'),cp=$('#cp');
  if(!stat)return;
  stat.textContent='Отправляю ответ…';again.hidden=true;cp.hidden=true;
  notify('Ответ на приглашение: да',answerLines(),'love_letter').then(
    function(){stat.textContent='Ответ отправлен. Я уже всё знаю.'},
    function(){stat.textContent='Не получилось отправить ответ. Нажми «Ещё раз» или скопируй его и пришли мне.';again.hidden=false;cp.hidden=false}
  );
}

/* ---------- эффекты ---------- */
function clearFx(){fx.innerHTML=''}
function spawnHearts(){
  if(reduced)return;
  var h='';
  for(var i=0;i<22;i++){
    var size=16+Math.random()*26,left=Math.random()*92,delay=Math.random()*2.2,dur=3.6+Math.random()*3;
    h+='<svg viewBox="0 0 24 24" style="left:'+left.toFixed(1)+'%;width:'+size.toFixed(0)+'px;height:'+size.toFixed(0)+'px;animation-duration:'+dur.toFixed(1)+'s;animation-delay:'+delay.toFixed(1)+'s"><path fill="currentColor" d="'+HEART_PATH+'"/></svg>';
  }
  fx.innerHTML=h;
  setTimeout(clearFx,10000);
}

/* ---------- навигация ---------- */
function go(s){
  st.screen=s;st.tries=0;
  clearFx();
  renderCard();
  window.scrollTo(0,0);
  if(s==='final'){if(cfg.final.hearts)spawnHearts();deliver()}
  if(s==='no'){notify('Ответ на приглашение: нет',['Нажала «Нет».'],'wave').catch(function(){})}
}
function nextScreen(){var l=list(),i=l.indexOf(st.screen);go(l[Math.min(i+1,l.length-1)])}

/* «Нет» отпрыгивает четыре раза, потом остаётся на месте и нажимается по-настоящему */
function bindRun(){
  var no=$('#n'),box=$('#ch'),last=0,armedAt=0,LIMIT=4;
  function flee(e){
    if(st.tries>=LIMIT)return;
    e.preventDefault();
    var now=Date.now();
    if(now-last>350){st.tries++;last=now}
    armedAt=now+700;
    var w=no.offsetWidth,h=no.offsetHeight,maxL=Math.max(0,box.clientWidth-w),maxT=Math.max(56,box.clientHeight-h);
    no.style.transform='none';
    no.style.left=(Math.random()*maxL)+'px';
    no.style.top=(56+Math.random()*(maxT-56))+'px';
  }
  no.addEventListener('pointerenter',flee);
  no.addEventListener('pointerdown',flee);
  no.addEventListener('click',function(e){
    if(st.tries<LIMIT||Date.now()<armedAt){e.preventDefault();return}
    go('no');
  });
  /* с клавиатуры «Нет» нажимается сразу, без прыжков */
  no.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();go('no')}
  });
}

/* ---------- экраны ---------- */
function renderCard(){
  var l=list();
  if(l.indexOf(st.screen)<0&&st.screen!=='no')st.screen='invite';
  var th=THEMES[cfg.design.theme]||THEMES[0];
  Object.keys(th).forEach(function(k){document.documentElement.style.setProperty(k,th[k])});
  pbar.hidden=!cfg.design.progress;
  var idx=Math.max(0,l.indexOf(st.screen));
  pbar.style.setProperty('--p',(l.length>1?idx/(l.length-1):0).toFixed(3));

  var s=st.screen,h='';
  var stk='<div class="stk">'+(STICKERS[cfg.invite.sticker]||STICKERS[0])+'</div>';

  if(s==='invite'){
    h=stk+'<h2>'+esc(cfg.invite.q)+'</h2>'+
      '<div class="choices" id="ch"><button class="pbtn main" id="y">'+esc(cfg.invite.yes)+'</button><button class="pbtn ghost" id="n">'+esc(cfg.invite.no)+'</button></div>';
    card.innerHTML=h;
    $('#y').onclick=function(){
      notify('Ответ на приглашение',['Нажала «'+cfg.invite.yes+'». Выбирает детали.'],'love_letter').catch(function(){});
      nextScreen();
    };
    if(cfg.invite.run&&!reduced)bindRun();
    else $('#n').addEventListener('click',function(){go('no')});

  }else if(s==='no'){
    card.innerHTML='<h2>'+esc(cfg.decline.title)+'</h2><p class="desc">'+esc(cfg.decline.desc)+'</p>';

  }else if(s.indexOf('c:')===0){
    var c=catByScreen(s);
    h='<h2>'+esc(c.title)+'</h2><p class="sub">'+esc(c.sub)+'</p><div class="opts">'+
      c.items.map(function(o,i){
        var on=(st.sel[c.key]||[]).indexOf(o.t)>-1;
        return '<button class="opt" data-i="'+i+'" aria-pressed="'+on+'"><span class="em">'+esc(o.e)+'</span><span>'+esc(o.t)+'</span></button>';
      }).join('')+'</div>'+(c.multi?'<button class="pbtn main" id="cont">Продолжить</button>':'');
    card.innerHTML=h;
    card.querySelectorAll('.opt').forEach(function(b){
      b.onclick=function(){
        var label=c.items[+b.dataset.i].t,arr=st.sel[c.key]||[];
        if(c.multi){
          var k=arr.indexOf(label);if(k>-1)arr.splice(k,1);else arr.push(label);
          st.sel[c.key]=arr;b.setAttribute('aria-pressed',k===-1);
        }else{
          st.sel[c.key]=[label];
          card.querySelectorAll('.opt').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
          setTimeout(nextScreen,240);
        }
      };
    });
    var ct=$('#cont');if(ct)ct.onclick=function(){nextScreen()};

  }else if(s==='date'){
    var dv=st.date||cfg.date.date;if(dv<todayIso())dv=todayIso();
    if(!st.date)st.date=dv;
    h=stk+'<h2>'+esc(cfg.date.title)+'</h2>'+
      '<div class="pfield"><label for="pd">Дата</label><input id="pd" type="date" min="'+todayIso()+'" value="'+esc(dv)+'"></div>'+
      '<div class="pfield"><label for="pt">Время</label><input id="pt" type="time" value="'+esc(st.time||cfg.date.time)+'"></div>'+
      '<button class="pbtn main" id="dgo">'+esc(cfg.date.btn)+'</button>';
    card.innerHTML=h;
    $('#pd').oninput=function(e){st.date=e.target.value};
    $('#pt').oninput=function(e){st.time=e.target.value};
    $('#dgo').onclick=function(){nextScreen()};

  }else{
    var dish=(st.sel.dishes||[])[0],emo='';
    if(dish){cfg.cats.forEach(function(c){if(c.key==='dishes')emo=emojiOf(c,dish)})}
    var rec=cats().map(function(c){
      var a=st.sel[c.key]||[];
      return a.length?'<li><span>'+esc(c.name)+':</span> '+esc(a.join(', '))+'</li>':'';
    }).join('');
    h=(emo?'<div class="bigemo">'+esc(emo)+'</div>':stk)+
      '<h2>'+esc(nb(fill(cfg.final.title)))+'</h2><p class="desc">'+esc(nb(fill(cfg.final.desc)))+'</p>'+
      (rec?'<ul class="recap">'+rec+'</ul>':'')+
      '<p class="pnote" id="stat" role="status"></p>'+
      '<div class="rowbtns" id="rb"><button class="pbtn main" id="again" hidden>Ещё раз</button><button class="pbtn ghost" id="cp" hidden>Скопировать ответ</button></div>';
    card.innerHTML=h;
    $('#again').onclick=deliver;
    $('#cp').onclick=function(){copyText(cardText(),$('#rb'))};
  }
  applyShape();
}

renderCard();
if(typeof ResizeObserver==='function')new ResizeObserver(applyShape).observe(card);
else window.addEventListener('resize',applyShape);
})();
</script>
</body>
</html>
